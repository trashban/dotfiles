$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 1
    inner_color = rgba(0, 0, 0, 0.0)

    outer_color = rgba(00000aa)
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff6633ee)

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 0

    font_family = $font
    placeholder_text = pwd?
    fail_text = $PAMFAIL$FPRINTFAIL

    check_text = checking...

    dots_spacing = 0.3

    hide_input = true
    hide_input_base_color = true

    position = 0, -20
    halign = center
    valign = center
}
