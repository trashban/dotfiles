# leader -> ctrl+a
unbind C-b
set-option -g prefix M-a
bind-key M-a send-prefix

# config reload -> ctrl+r
bind r source-file "~/.config/tmux/tmux.conf" \; display "reloaded config"

# base index -> 1
set -g base-index 1
setw -g pane-base-index 1

# enforce default shell
set -g default-command "${SHELL}"

# set tmux colours
set -g default-terminal "screen-256color"

# allow mouse scroll
setw -g mouse on
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# clipboard wayland support
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy && wl-paste -n | wl-copy -p"
bind-key p run "wl-paste -n | tmux load-buffer - ; tmux paste-buffer"

# disable bell
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 10

# increase limits
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5

# focus events
set -g focus-events on

# apparently good for multi-monitors
setw -g aggressive-resize on

# set tmux to show on the top
set -g status-position top

# panes
set -g renumber-windows on
set -g pane-border-style 'fg=purple'

# theme
set -g status-left ""
set -g status-right "#S"
set -g status-style bg="#000000",fg="#545660"
set -g window-status-current-style bg="#000000",fg="#ffffff"

set-window-option -g window-status-current-format '(#I)#W'
set-window-option -g window-status-format '#I:#W'
